# Helm values overrides for kube-prometheus-stack (chart 84.5.0).

# Existing Grafana (grafana-1777830317) is managed separately — disable bundled one.
grafana:
  enabled: false

# Trim resources for local k3s.
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - prometheus.wfink.cc
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.wfink.cc
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 1Gi

# Skip alertmanager for local dev; flip enabled: true to bring it back.
alertmanager:
  enabled: false
