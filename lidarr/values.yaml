controllers:
  main:
    initContainers:
      install-tubifarry-plugin:
        image:
          repository: alpine
          tag: "3.21"
        command:
          - /bin/sh
          - -c
          - |
            apk add --no-cache curl unzip
            rm -rf /config/plugins/Lidarr.Plugin.Slskd \
                   /config/plugins/runtimes \
                   /config/plugins/Lidarr.Plugin.Slskd.dll \
                   /config/plugins/Lidarr.Plugin.Slskd.pdb \
                   /config/plugins/Lidarr.Plugin.Slskd.deps.json \
                   /config/plugins/Lidarr.Plugin.Slskd.zip
            mkdir -p /config/plugins/Lidarr.Plugin.Tubifarry
            TUBIFARRY_URL=$(curl -fsSL "https://api.github.com/repos/TypNull/Tubifarry/releases/latest" \
              | grep -o '"browser_download_url": "[^"]*net8\.0\.zip"' \
              | sed 's/.*"\(https[^"]*\)".*/\1/')
            curl -fsSL -o /tmp/tubifarry.zip "$TUBIFARRY_URL"
            unzip -o /tmp/tubifarry.zip -d /config/plugins/Lidarr.Plugin.Tubifarry/
    containers:
      main:
        image:
          repository: ghcr.io/linuxserver/lidarr
          tag: nightly
        env:
          PUID: "501"
          PGID: "20"
          TZ: "America/New_York"

service:
  main:
    controller: main
    ports:
      http:
        port: 8686

ingress:
  main:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: lidarr.wfink.cc
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - secretName: lidarr-tls
        hosts:
          - lidarr.wfink.cc

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: app-lidarr-config
    globalMounts:
      - path: /config
  library:
    type: persistentVolumeClaim
    existingClaim: music-library
    globalMounts:
      - path: /library
  ingest:
    type: persistentVolumeClaim
    existingClaim: music-ingest
    globalMounts:
      - path: /downloads
