controllers:
  main:
    initContainers:
      install-slskd-plugin:
        image:
          repository: alpine
          tag: "3.21"
        command:
          - /bin/sh
          - -c
          - |
            apk add --no-cache curl unzip
            mkdir -p /config/plugins
            curl -fsSL -o /tmp/slskd-plugin.zip \
              "https://github.com/allquiet-hub/Lidarr.Plugin.Slskd/releases/latest/download/Lidarr.Plugin.Slskd.net6.0.zip"
            unzip -o /tmp/slskd-plugin.zip -d /config/plugins/Lidarr.Plugin.Slskd/
    containers:
      main:
        image:
          repository: ghcr.io/linuxserver/lidarr
          tag: nightly
        env:
          PUID: "501"
          PGID: "20"
          TZ: "America/New_York"

service:
  main:
    controller: main
    ports:
      http:
        port: 8686

ingress:
  main:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: lidarr.wfink.cc
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - secretName: lidarr-tls
        hosts:
          - lidarr.wfink.cc

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: app-lidarr-config
    globalMounts:
      - path: /config
  library:
    type: persistentVolumeClaim
    existingClaim: music-library
    globalMounts:
      - path: /library
  ingest:
    type: persistentVolumeClaim
    existingClaim: music-ingest
    globalMounts:
      - path: /downloads
