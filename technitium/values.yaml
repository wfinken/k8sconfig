# technitium/values.yaml
# Resolved port conflict by removing Port 80 from the LoadBalancer service.
# The Web UI will be accessed exclusively via Traefik Ingress.

service:
  main:
    enabled: true
    primary: true
    type: LoadBalancer
    ports:
      # Port 80 removed here to avoid conflict with Traefik on k3d nodes.
      # The chart still creates the ClusterIP/internal port needed for Ingress.
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    hosts:
      - host: dns.local
        paths:
          - path: /
            pathType: Prefix

persistence:
  config:
    enabled: true
    type: pvc
    size: 1Gi
    mountPath: /etc/dns
