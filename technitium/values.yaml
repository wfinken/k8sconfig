# technitium/values.yaml
# Explicitly disabling all ports that conflict with Traefik or are unused.

service:
  main:
    enabled: true
    primary: true
    type: LoadBalancer
    ports:
      # DNS (TCP/UDP) - These are the only ports we want to expose via LoadBalancer
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53
      
      # Web UI - Keep the internal port for Ingress but DISABLE the service port exposure
      # by setting enabled: false or changing the port. 
      # Actually, to use Ingress, we need an internal port. 
      # The chart uses port 5380 internally. 
      # We disable the LoadBalancer exposure of 80/443.
      http:
        enabled: false
      https:
        enabled: false
      dhcp:
        enabled: false
      dot:
        enabled: false
      doh-reverse:
        enabled: false

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    hosts:
      - host: dns.local
        paths:
          - path: /
            pathType: Prefix
    # Point ingress to the internal Technitium port
    service:
      name: main
      port: 5380

persistence:
  config:
    enabled: true
    type: pvc
    size: 1Gi
    mountPath: /etc/dns
