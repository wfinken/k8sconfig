# technitium/values.yaml
# Updated to ensure port 5380 is available for the Web UI
priorityClassName: dns-critical

service:
  main:
    enabled: true
    primary: true
    type: LoadBalancer
    ports:
      # DNS (TCP/UDP) - Exposed via LoadBalancer
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53
      
      # Web UI (Port 5380)
      # We enable it here so it's available for Ingress and port-forwarding,
      # but we use port 5380 so it doesn't conflict with Traefik's port 80.
      http:
        enabled: true
        port: 5380
        targetPort: 5380
      
      # Disable other unused ports
      https:
        enabled: false
      dhcp:
        enabled: false
      dot:
        enabled: false
      doh-reverse:
        enabled: false

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: dns.wfink.cc
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: technitium-tls
        hosts:
          - dns.wfink.cc

persistence:
  config:
    enabled: true
    type: pvc
    size: 1Gi
    mountPath: /etc/dns
