# technitium/values.yaml
# Complete configuration with Ingress and Persistence restored
service:
  main:
    enabled: true
    primary: true
    type: LoadBalancer
    ports:
      http:
        enabled: true
        port: 80
        targetPort: 5380
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    hosts:
      - host: dns.local
        paths:
          - path: /
            pathType: Prefix

persistence:
  config:
    enabled: true
    type: pvc
    size: 1Gi
    mountPath: /etc/dns
