# technitium/values.yaml
# Strictly following the k8s-at-home common library v4.5.2 structure

service:
  main:
    enabled: true
    primary: true
    type: LoadBalancer
    ports:
      http:
        enabled: true
        port: 80
        targetPort: 5380
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53

ingress:
  main:
    enabled: true
    ingressClassName: "traefik"
    annotations: {}
    hosts:
      - host: dns.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

persistence:
  config:
    enabled: true
    type: pvc
    size: 1Gi
    mountPath: /etc/dns
