# technitium/values.yaml - NO INGRESS VERSION
service:
  main:
    enabled: true
    type: LoadBalancer
    ports:
      http:
        enabled: true
        port: 80
        targetPort: 5380
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53

# Removed ingress block entirely to avoid template error
# The chart defaults should keep it disabled.

persistence:
  config:
    enabled: false
