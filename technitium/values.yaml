# technitium/values.yaml
service:
  # Main service for the Web Management Console (Port 5380)
  main:
    enabled: true
    type: ClusterIP
    ports:
      http:
        port: 5380

  # Dedicated service for DNS traffic (UDP and TCP)
  dns:
    enabled: true
    type: LoadBalancer
    # externalTrafficPolicy: Local
    ports:
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53

# Enable persistent storage for config and zones
persistence:
  config:
    enabled: true
    size: 1Gi
    mountPath: /etc/dns/config

# Expose the Web UI via Traefik Ingress
ingress:
  main:
    enabled: true
    className: "traefik"
    hosts:
      - host: dns.local
        paths:
          - path: /
            pathType: Prefix
