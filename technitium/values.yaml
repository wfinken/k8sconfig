# technitium/values.yaml - MINIMAL TEST VERSION
service:
  main:
    enabled: true
    type: LoadBalancer
    ports:
      http:
        enabled: true
        port: 80
        targetPort: 5380
      dns-udp:
        enabled: true
        port: 53
        protocol: UDP
        targetPort: 53
      dns-tcp:
        enabled: true
        port: 53
        protocol: TCP
        targetPort: 53

# Disabling ingress entirely to see if manifest generation succeeds
ingress:
  main:
    enabled: false

persistence:
  config:
    enabled: false
