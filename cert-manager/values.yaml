# Helm values overrides for cert-manager (chart v1.20.2).

# Bundle CRDs (ClusterIssuer, Certificate, CertificateRequest, etc.) with the chart
# so ArgoCD applies them as part of this Application — necessary before the
# cert-manager-issuers Application can succeed.
crds:
  enabled: true
  keep: true

# Use public DNS for DNS-01 propagation checks instead of cluster-internal DNS,
# which returns SERVFAIL for external zones like wfink.cc.
extraArgs:
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
  - --dns01-recursive-nameservers-only

# Trim resources for local k3s.
resources:
  requests:
    cpu: 10m
    memory: 32Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
