apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/wfinken/k8sconfig
    targetRevision: HEAD
    path: manifests/argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
