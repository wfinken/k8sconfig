apiVersion: v1
kind: PersistentVolume
metadata:
  name: music
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /Volumes/Storage/Media/Music
    type: Directory
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-library
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /Volumes/Storage/Media/Music/library
    type: Directory
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-ingest
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /Volumes/Storage/Media/Music/ingest
    type: Directory
