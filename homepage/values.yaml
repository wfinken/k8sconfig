# jameswynn/homepage Helm chart values (chart 2.1.0)

enableRbac: true

serviceAccount:
  create: true
  name: homepage

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.wfink.cc

ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: homepage.wfink.cc
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: homepage-tls
        hosts:
          - homepage.wfink.cc

config:
  kubernetes:
    mode: cluster

  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    statusStyle: dot
    layout:
      Infrastructure:
        style: row
        columns: 4
        icon: mdi-server-network
      Monitoring:
        style: row
        columns: 2
        icon: mdi-chart-line
      Apps:
        style: row
        columns: 2
        icon: mdi-apps
      Bookmarks:
        style: row
        columns: 4
        icon: mdi-bookmark-outline

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium
          hour12: false
    - search:
        provider: duckduckgo
        target: _blank
        focus: false

  services:
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.wfink.cc
            description: GitOps Continuous Delivery
            icon: argo-cd.png
            namespace: argocd
            app: argocd-server
        - Technitium:
            href: https://dns.wfink.cc
            description: Internal DNS Server
            icon: technitium.png
            namespace: technitium
            app: technitium-dnsserver
        - cert-manager:
            href: https://argocd.wfink.cc/applications/argocd/cert-manager
            description: TLS Certificate Management
            icon: cert-manager.png
            namespace: cert-manager
            app: cert-manager

    - Monitoring:
        - Grafana:
            href: https://grafana.wfink.cc
            description: Dashboards & Visualization
            icon: grafana.png
            namespace: default
            app: grafana
        - Prometheus:
            href: https://prometheus.wfink.cc
            description: Metrics & Alerting
            icon: prometheus.png
            namespace: monitoring
            app: prometheus
            widget:
              type: prometheus
              url: http://prometheus-operated.monitoring.svc.cluster.local:9090

    - Apps:
        - Memos:
            href: https://memos.wfink.cc
            description: Notes & Memos
            icon: memos.png
            namespace: memos
            app: memos

  bookmarks:
    - Code:
        - k8sconfig:
            - abbr: K8
              href: https://github.com/wfinken/k8sconfig
        - GitHub:
            - abbr: GH
              href: https://github.com/wfinken
