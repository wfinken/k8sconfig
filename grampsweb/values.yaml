gramps:
  baseURL: "https://grampsweb.wfink.cc"
  tree: "Gramps Web"
  registrationDisabled: true
  disableTelemetry: true

persistence:
  enabled: true
  existingClaim: app-grampsweb-data

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: grampsweb.wfink.cc
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: grampsweb-tls
      hosts:
        - grampsweb.wfink.cc
